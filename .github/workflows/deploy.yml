name: Deploy AzureRegionPing

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-arp-dev-core
  LOCATION: eastus2

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    outputs:
      env-domain: ${{ steps.get-domain.outputs.domain }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Bicep
        run: |
          az deployment sub create \
            --location ${{ env.LOCATION }} \
            --template-file infra/main.bicep \
            --parameters environment=dev agentApiKey="${{ secrets.AGENT_API_KEY }}"
      - name: Get Container Env domain
        id: get-domain
        run: |
          domain=$(az containerapp env show --name arp-dev-env --resource-group ${{ env.RESOURCE_GROUP }} --query "properties.defaultDomain" -o tsv)
          echo "domain=$domain" >> $GITHUB_OUTPUT

  deploy-orchestrator:
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        working-directory: functions/orchestrator
        run: npm ci && npm run build
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Container App
        run: |
          az containerapp up \
            --name arp-dev-orch \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --source functions/orchestrator
      - name: Set env vars
        run: |
          CONTAINER=$(az containerapp show --name arp-dev-orch -g ${{ env.RESOURCE_GROUP }} --query "properties.template.containers[?name!='orchestrator'].name | [0]" -o tsv)
          [ -z "$CONTAINER" ] && CONTAINER="arp-dev-orch"
          az containerapp update --name arp-dev-orch -g ${{ env.RESOURCE_GROUP }} \
            --container-name "$CONTAINER" \
            --set-env-vars \
              "AGENT_URL_PATTERN=https://arp-dev-ping-{region}.${{ needs.deploy-infra.outputs.env-domain }}" \
              "PORT=3000"

  deploy-agents:
    runs-on: ubuntu-latest
    needs: [deploy-infra, deploy-orchestrator]
    strategy:
      max-parallel: 2
      matrix:
        region: [eastus, eastus2, westus2, westeurope, southeastasia, australiaeast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        working-directory: functions/ping-agent
        run: npm ci && npm run build
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy agent
        run: |
          az containerapp up \
            --name arp-dev-ping-${{ matrix.region }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --source functions/ping-agent
      - name: Set env vars
        run: |
          CONTAINER=$(az containerapp show --name arp-dev-ping-${{ matrix.region }} -g ${{ env.RESOURCE_GROUP }} --query "properties.template.containers[?name!='ping-agent'].name | [0]" -o tsv)
          [ -z "$CONTAINER" ] && CONTAINER="arp-dev-ping-${{ matrix.region }}"
          az containerapp update --name arp-dev-ping-${{ matrix.region }} -g ${{ env.RESOURCE_GROUP }} \
            --container-name "$CONTAINER" \
            --set-env-vars \
              "REGION_ID=${{ matrix.region }}" \
              "PORT=3000"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        working-directory: frontend
        run: npm ci && npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
