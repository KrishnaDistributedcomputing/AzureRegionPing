name: Deploy AzureRegionPing

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-arp-dev-core
  LOCATION: eastus2

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Bicep
        run: |
          az deployment sub create \
            --location ${{ env.LOCATION }} \
            --template-file infra/main.bicep \
            --parameters environment=dev agentApiKey="${{ secrets.AGENT_API_KEY }}"

  deploy-orchestrator:
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        working-directory: functions/orchestrator
        run: npm ci && npm run build
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Container App
        run: |
          az containerapp up \
            --name arp-dev-orch \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --source functions/orchestrator

  deploy-agents:
    runs-on: ubuntu-latest
    needs: deploy-infra
    strategy:
      max-parallel: 5
      matrix:
        region: [eastus, westus2, westeurope, southeastasia, australiaeast]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        working-directory: functions/ping-agent
        run: npm ci && npm run build
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy agent
        run: |
          az containerapp up \
            --name arp-dev-ping-${{ matrix.region }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --source functions/ping-agent

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        working-directory: frontend
        run: npm ci && npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
